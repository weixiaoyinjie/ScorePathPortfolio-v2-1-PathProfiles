name: Build ScorePath Portfolio APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Source ZIP
        run: |
          mkdir -p extracted
          unzip -o ScorePathPortfolio_v2_1_PathProfiles_OneUpload.zip -d extracted

      - name: Find Gradle Project
        run: |
          FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Enable AndroidX
        run: |
          cd "$PROJECT_DIR"
          touch gradle.properties
          sed -i '/^[[:space:]]*android.useAndroidX[[:space:]]*=/d' gradle.properties
          printf '\nandroid.useAndroidX=true\n' >> gradle.properties
          cat gradle.properties

      - name: Check Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace -Pandroid.useAndroidX=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScorePathPortfolio-v2.1-debug
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
